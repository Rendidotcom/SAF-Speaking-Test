<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Speaking Test | SAF</title>

    <link
        rel="icon"
        href="images/logo.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==========================================
           BODY
        ========================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eef3f8;

            color: #333;

        }


        /* ==========================================
           CONTAINER
        ========================================== */

        .container {

            max-width: 1100px;

            margin: auto;

            padding: 40px;

        }


        /* ==========================================
           CARD
        ========================================== */

        .card {

            background: #fff;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, .08);

            margin-bottom: 25px;

        }


        /* ==========================================
           HEADER
        ========================================== */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .header h1 {

            color: #0B72B9;

            margin-bottom: 8px;

        }


        .header p {

            color: #555;

            line-height: 1.5;

        }


        /* ==========================================
           INFO
        ========================================== */

        .info {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 20px;

        }


        /* ==========================================
           INFO BOX
        ========================================== */

        .box {

            background: #f7f9fc;

            padding: 20px;

            border-radius: 12px;

        }


        .box h3 {

            margin-bottom: 8px;

            color: #0B72B9;

        }


        .box p {

            line-height: 1.6;

        }


        /* ==========================================
           INPUT
        ========================================== */

        input {

            width: 100%;

            padding: 14px;

            font-size: 16px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            outline: none;

        }


        input:focus {

            border-color: #0B72B9;

        }


        /* ==========================================
           BUTTON
        ========================================== */

        button {

            padding: 14px 22px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            margin-top: 15px;

        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        /* ==========================================
           PRIMARY
        ========================================== */

        .primary {

            background: #0B72B9;

            color: white;

        }


        .primary:hover {

            background: #095c95;

        }


        /* ==========================================
           SUCCESS
        ========================================== */

        .success {

            background: #28a745;

            color: white;

        }


        .success:hover {

            background: #218838;

        }


        /* ==========================================
           DANGER
        ========================================== */

        .danger {

            background: #dc3545;

            color: white;

        }


        .danger:hover {

            background: #c82333;

        }


        /* ==========================================
           QUESTION
        ========================================== */

        .question {

            font-size: 24px;

            line-height: 1.6;

            margin-top: 20px;

            padding: 20px;

            background: #f7f9fc;

            border-radius: 12px;

        }


        /* ==========================================
           QUESTION META
        ========================================== */

        .question-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 15px;

            margin-top: 15px;

        }


        .question-meta span {

            background: #eef3f8;

            padding: 8px 14px;

            border-radius: 8px;

            font-size: 14px;

        }


        /* ==========================================
           TRANSCRIPT
        ========================================== */

        .transcript {

            margin-top: 20px;

            padding: 20px;

            background: #fafafa;

            border-radius: 12px;

            min-height: 180px;

            border:
                2px dashed #ccc;

            white-space: pre-wrap;

            line-height: 1.7;

        }


        /* ==========================================
           STATUS
        ========================================== */

        .status {

            margin-top: 15px;

            font-weight: bold;

            color: #0B72B9;

            line-height: 1.5;

        }


        /* ==========================================
           HIDDEN
        ========================================== */

        .hidden {

            display: none;

        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 700px) {

            .container {

                padding: 20px;

            }


            .card {

                padding: 25px;

            }


            .header {

                gap: 20px;

            }


            .header img {

                width: 70px;

            }


            .question {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================================
         HEADER
    ========================================== -->

    <div class="header">

        <div>

            <h1>
                🎤 Speaking Test
            </h1>

            <p>
                SAF Speaking Online Test
            </p>

        </div>


        <img
            src="images/logo.png"
            width="90"
            alt="SAF Logo"
        >

    </div>


    <!-- ==========================================
         STUDENT INFORMATION
    ========================================== -->

    <div class="card">

        <div class="info">


            <!-- STUDENT -->

            <div class="box">

                <h3>
                    Student
                </h3>

                <p id="studentName">
                    -
                </p>

            </div>


            <!-- CLASS -->

            <div class="box">

                <h3>
                    Class
                </h3>

                <p id="studentClass">
                    -
                </p>

            </div>


            <!-- STATUS -->

            <div class="box">

                <h3>
                    Status
                </h3>

                <p id="examStatus">
                    Waiting Token
                </p>

            </div>


        </div>

    </div>


    <!-- ==========================================
         EXAM TOKEN
    ========================================== -->

    <div class="card">

        <h2>
            Exam Token
        </h2>

        <br>


        <input
            id="token"
            type="text"
            placeholder="Enter Exam Token"
            autocomplete="off"
            spellcheck="false"
        >


        <button
            id="validateTokenButton"
            type="button"
            class="primary"
            onclick="validateToken()"
        >

            Validate Token

        </button>

    </div>


    <!-- ==========================================
         EXAM AREA
         
         Hidden until token is successfully
         validated by speaking.js
    ========================================== -->

    <div
        id="examArea"
        class="hidden"
    >


        <!-- ======================================
             SPEAKING QUESTION
        ======================================= -->

        <div class="card">

            <h2>
                Speaking Question
            </h2>


            <div
                class="question"
                id="question"
            >

                Loading question...

            </div>


            <!-- ==================================
                 QUESTION INFORMATION
            =================================== -->

            <div class="question-meta">


                <span>

                    Difficulty:

                    <strong id="questionDifficulty">
                        -
                    </strong>

                </span>


                <span>

                    Duration:

                    <strong id="questionDuration">
                        -
                    </strong>

                    seconds

                </span>


            </div>

        </div>


        <!-- ======================================
             VOICE RECORDING
        ======================================= -->

        <div class="card">

            <h2>
                Voice Recording
            </h2>


            <!-- ==================================
                 START RECORDING
            =================================== -->

            <button
                id="startRecordingButton"
                type="button"
                class="success"
                onclick="startRecording()"
            >

                🎙 Start Recording

            </button>


            <!-- ==================================
                 STOP RECORDING
            =================================== -->

            <button
                id="stopRecordingButton"
                type="button"
                class="danger"
                onclick="stopRecording()"
            >

                ⏹ Stop

            </button>


            <!-- ==================================
                 RECORD STATUS
            =================================== -->

            <div
                class="status"
                id="recordStatus"
            >

                Ready

            </div>


            <!-- ==================================
                 TRANSCRIPT
            =================================== -->

            <div
                class="transcript"
                id="transcript"
            >

                Your transcript will appear here...

            </div>


            <!-- ==================================
                 SUBMIT ANSWER
            =================================== -->

            <button
                id="submitAnswerButton"
                type="button"
                class="primary"
                onclick="submitAnswer()"
            >

                Submit Answer

            </button>


        </div>


    </div>


</div>


<!-- ==========================================
     CORE CONFIG
     
     MUST LOAD FIRST
========================================== -->

<script src="js/config.js"></script>


<!-- ==========================================
     API MODULE
========================================== -->

<script src="js/api.js"></script>


<!-- ==========================================
     SPEAKING MODULE
     
     ALL SPEAKING LOGIC IS HERE
========================================== -->

<script src="js/speaking.js"></script>


</body>

</html>
