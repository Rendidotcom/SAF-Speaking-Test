<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Speaking Test | SAF</title>

<link rel="icon" href="images/logo.png">

<link rel="stylesheet" href="css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;
background:#eef3f8;
color:#333;

}

.container{

max-width:1100px;
margin:auto;
padding:40px;

}

.card{

background:#fff;
padding:35px;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
margin-bottom:25px;

}

.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;

}

.header h1{

color:#0B72B9;

}

.info{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}

.box{

background:#f7f9fc;
padding:20px;
border-radius:12px;

}

.box h3{

margin-bottom:8px;
color:#0B72B9;

}

input{

width:100%;
padding:14px;
font-size:16px;
border:1px solid #ddd;
border-radius:10px;

}

button{

padding:14px 22px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:bold;
margin-top:15px;

}

.primary{

background:#0B72B9;
color:white;

}

.success{

background:#28a745;
color:white;

}

.danger{

background:#dc3545;
color:white;

}

.question{

font-size:24px;
line-height:1.6;
margin-top:20px;

}

.transcript{

margin-top:20px;
padding:20px;
background:#fafafa;
border-radius:12px;
min-height:180px;
border:2px dashed #ccc;
white-space:pre-wrap;

}

.status{

margin-top:15px;
font-weight:bold;
color:#0B72B9;

}

.hidden{

display:none;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div>

<h1>🎤 Speaking Test</h1>

<p>SAF Speaking Online Test</p>

</div>

<img src="images/logo.png" width="90">

</div>

<div class="card">

<div class="info">

<div class="box">

<h3>Student</h3>

<p id="studentName">-</p>

</div>

<div class="box">

<h3>Class</h3>

<p id="studentClass">-</p>

</div>

<div class="box">

<h3>Status</h3>

<p id="examStatus">

Waiting Token

</p>

</div>

</div>

</div>

<div class="card">

<h2>Exam Token</h2>

<br>

<input
id="token"
placeholder="Enter Exam Token">

<button
class="primary"
onclick="validateToken()">

Validate Token

</button>

</div>

<div
id="examArea"
class="hidden">

<div class="card">

<h2>Speaking Question</h2>

<div
class="question"
id="question">

Loading...

</div>

</div>

<div class="card">

<h2>Voice Recording</h2>

<button
class="success"
onclick="startRecording()">

🎙 Start Recording

</button>

<button
class="danger"
onclick="stopRecording()">

⏹ Stop

</button>

<div
class="status"
id="recordStatus">

Ready

</div>

<div
class="transcript"
id="transcript">

Your transcript will appear here...

</div>

<button
class="primary"
onclick="submitAnswer()">

Submit Answer

</button>

</div>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>

<script>

const user=JSON.parse(
sessionStorage.getItem(CONFIG.SESSION_KEY)
);

if(!user){

location.href="login.html?role=student";

}

document.getElementById("studentName").innerHTML=user.nama;

document.getElementById("studentClass").innerHTML=user.kelas;

function validateToken(){

const token=document.getElementById("token").value.trim();

if(token==""){

alert("Token required");

return;

}

document.getElementById("examStatus").innerHTML="Token Verified";

document.getElementById("question").innerHTML=
"Introduce yourself and tell us about your hobby.";

document.getElementById("examArea").classList.remove("hidden");

}

let recognition;

function startRecording(){

if(!('webkitSpeechRecognition' in window)){

alert("Speech Recognition not supported");

return;

}

recognition=new webkitSpeechRecognition();

recognition.lang="en-US";

recognition.continuous=true;

recognition.interimResults=true;

recognition.onresult=function(e){

let text="";

for(let i=0;i<e.results.length;i++){

text+=e.results[i][0].transcript+" ";

}

document.getElementById("transcript").innerHTML=text;

};

recognition.start();

document.getElementById("recordStatus").innerHTML="Recording...";

}

function stopRecording(){

if(recognition){

recognition.stop();

}

document.getElementById("recordStatus").innerHTML="Finished";

}

function submitAnswer(){

alert("Next step: save transcript to Apps Script.");

}

</script>

</body>

</html>
