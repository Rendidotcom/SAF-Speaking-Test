<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SAF Speaking Online Test</title>

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <img
            src="images/logo.png"
            class="logo"
            alt="Logo SMP Salman Al Farisi">

        <h1 id="loginTitle">
            Login
        </h1>

        <p id="loginSubtitle">
            Please login to continue.
        </p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username / NIS"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button
                type="submit"
                class="btn teacher"
                style="width:100%;border:none;cursor:pointer;">

                Login

            </button>

        </form>

        <br>

        <a
            href="index.html"
            class="btn student">

            ← Back

        </a>

    </div>

</div>

<script src="api/config.js"></script>
<script src="api/api.js"></script>
<script src="api/login.js"></script>

</body>

</html>
